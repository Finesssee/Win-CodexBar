name: PR check

# Blacksmith CI only: PR validation. Release assets stay in CircleCI.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CONTEXT.md'
      - '.github/CI.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CONTEXT.md'
      - '.github/CI.md'
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-check:
    name: Local check
    if: vars.CI_BUDGET_MODE != 'off'
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - uses: actions/checkout@v4

      # The runner image preinstalls these std targets; dropping them before the
      # stable sync avoids re-downloading rust-std for targets CI never builds.
      - name: Remove unused preinstalled Rust targets
        run: rustup target remove x86_64-pc-windows-gnu i686-pc-windows-msvc
        continue-on-error: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm --dir apps/desktop-tauri install --frozen-lockfile

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (workspace)
        run: cargo test --workspace

      - name: Frontend tests
        run: pnpm --dir apps/desktop-tauri test

      - name: Frontend type check / build
        run: pnpm --dir apps/desktop-tauri run build

      - name: Interaction guard script tests
        run: node --test .github/scripts/interaction-guard.test.mjs

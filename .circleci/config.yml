version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  release-build:
    executor:
      name: win/default
      size: large
    environment:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
      NO_COLOR: '1'
    steps:
      - checkout
      - run:
          name: Assert build job has no GitHub write credential
          shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          command: |
            if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'GH_TOKEN must be absent from release-build.' }
      - run:
          name: Validate canonical release tag, SHA, versions, and main ancestry
          shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'GH_TOKEN must be absent from the credential-free release-build job.' }
            $root = (Get-Location).Path
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\release-preflight.ps1') -Tag $env:CIRCLE_TAG -Sha $env:CIRCLE_SHA1 -RepoRoot $root
            if ($LASTEXITCODE -ne 0) { throw "release-preflight.ps1 failed with exit code $LASTEXITCODE" }
      - run:
          name: Provision and assert pinned release prerequisites
          shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $root = (Get-Location).Path
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\install-release-prerequisites.ps1') -RepoRoot $root
            if ($LASTEXITCODE -ne 0) { throw "install-release-prerequisites.ps1 failed with exit code $LASTEXITCODE" }
      - restore_cache:
          name: Restore Cargo registry cache
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - restore_cache:
          name: Restore Cargo target and pnpm store cache
          keys:
            - release-cache-{{ checksum "Cargo.lock" }}-{{ checksum "rust/Cargo.toml" }}-{{ checksum "apps/desktop-tauri/src-tauri/Cargo.toml" }}
            - release-cache-{{ checksum "Cargo.lock" }}-
      - run:
          name: Build, smoke-install, and emit verified assets
          no_output_timeout: 90m
          shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $root = (Get-Location).Path
            $output = Join-Path $root 'release-output'
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'scripts\circleci-release-build.ps1') -Tag $env:CIRCLE_TAG -Sha $env:CIRCLE_SHA1 -RepoRoot $root -OutputDir $output
            if ($LASTEXITCODE -ne 0) { throw "circleci-release-build.ps1 failed with exit code $LASTEXITCODE" }
      - save_cache:
          name: Save Cargo registry cache
          key: cargo-registry-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
      - save_cache:
          name: Save Cargo target and pnpm store cache
          key: release-cache-{{ checksum "Cargo.lock" }}-{{ checksum "rust/Cargo.toml" }}-{{ checksum "apps/desktop-tauri/src-tauri/Cargo.toml" }}
          paths:
            - ~/cb/release/cache
      - persist_to_workspace:
          root: .
          paths:
            - release-output
            - scripts/publish-github-release.ps1
            - scripts/release-pipeline-common.ps1
      - store_artifacts:
          path: release-output
          destination: release-output

  release-publish:
    executor:
      name: win/default
      size: medium
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install gh, verify manifest, and publish release assets
          shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $gh = Get-Command gh -ErrorAction SilentlyContinue
            if (-not $gh) {
              $ghDir = Join-Path $env:LOCALAPPDATA 'gh'
              New-Item -ItemType Directory -Force -Path $ghDir | Out-Null
              $zipPath = Join-Path ([IO.Path]::GetTempPath()) 'gh.zip'
              $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/cli/cli/releases/latest' -Headers @{ 'User-Agent' = 'circleci' }
              $asset = $release.assets | Where-Object { $_.name -match 'windows_amd64\.zip$' } | Select-Object -First 1
              if (-not $asset) { throw 'Could not find GitHub CLI Windows amd64 zip' }
              Write-Host "Downloading $($asset.name)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
              Expand-Archive -LiteralPath $zipPath -DestinationPath $ghDir -Force
              $ghExe = Get-ChildItem -Path $ghDir -Recurse -Filter 'gh.exe' | Select-Object -First 1
              if (-not $ghExe) { throw 'gh.exe not found after extraction' }
              $env:Path = "$($ghExe.DirectoryName);$env:Path"
              Write-Host "Installed gh at $($ghExe.FullName)"
            }
            $env:GH_TOKEN = if ($env:GH_TOKEN) { $env:GH_TOKEN } elseif ($env:gh_token) { $env:gh_token } else { '' }; if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'GH_TOKEN is required only in the restricted publisher context.' }
            $root = (Get-Location).Path
            $manifestPath = Join-Path $root 'release-output\release-manifest.json'
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw "Missing persisted release manifest: $manifestPath" }
            $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
            if ($manifest.repository -ne 'nesszer/Win-CodexBar') { throw "Manifest repository is not canonical nesszer/Win-CodexBar." }
            if ($manifest.tag -ne $env:CIRCLE_TAG) { throw "Manifest tag does not match CIRCLE_TAG." }
            if (-not $env:CIRCLE_SHA1 -or $env:CIRCLE_SHA1 -notmatch '^[0-9a-fA-F]{40}$' -or [string]$manifest.commit -cne ($env:CIRCLE_SHA1).ToLowerInvariant()) { throw 'Manifest commit must equal lowercase CIRCLE_SHA1.' }
            $env:RELEASE_SHA = [string]$manifest.commit
            $publisher = Join-Path $root 'scripts\publish-github-release.ps1'
            if (-not (Test-Path -LiteralPath $publisher -PathType Leaf)) { throw "Missing persisted publisher helper: $publisher" }
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $publisher -AssetsDir (Join-Path $root 'release-output') -Tag $env:CIRCLE_TAG
            if ($LASTEXITCODE -ne 0) { throw "publish-github-release.ps1 failed with exit code $LASTEXITCODE" }


  pr-check:
    executor:
      name: win/default
      size: medium
    environment:
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - run:
          name: Budget and trigger gates
          shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            # Gate 1 - budget: CI_BUDGET_MODE=off is the emergency stop (unset/empty = normal).
            if ($env:CI_BUDGET_MODE -eq 'off') {
              Write-Host 'CI_BUDGET_MODE is off: hosted pr-check skips (emergency stop).'
              & circleci-agent step halt
              if ($LASTEXITCODE -ne 0) { throw "circleci-agent step halt exited with code $LASTEXITCODE" }
              exit 0
            }
            Write-Host "CI_BUDGET_MODE is '$($env:CI_BUDGET_MODE)': hosted pr-check passes budget gate."
            # Gate 2 - branch/PR scope: the GitHub workflow fires on PRs plus pushes to
            # main/master only. GitHub App pipelines expose PR association via the
            # compile-time pipeline value pipeline.event.context.github.pr_url (docs:
            # "matches environment variable CIRCLE_PULL_REQUEST"); the legacy
            # CIRCLE_PULL_REQUEST*/CIRCLE_PR_NUMBER env vars are OAuth-integration
            # variables and are not populated on GitHub App pipelines. On push
            # pipelines the PR values interpolate to empty strings, so the step
            # compiles and runs for push, PR, and api triggers alike.
            $prUrl = '<< pipeline.event.context.github.pr_url >>'
            $isPr = -not [string]::IsNullOrWhiteSpace($prUrl)
            $isMainPush = $env:CIRCLE_BRANCH -in @('main', 'master')
            if (-not $isPr -and -not $isMainPush) {
              Write-Host "Branch push to '$($env:CIRCLE_BRANCH)' (not a PR, not main/master): hosted pr-check skips."
              & circleci-agent step halt
              if ($LASTEXITCODE -ne 0) { throw "circleci-agent step halt exited with code $LASTEXITCODE" }
              exit 0
            }
            Write-Host "Trigger gate passed (PR: $isPr, branch: $($env:CIRCLE_BRANCH)): hosted pr-check passes scope gate."
            # Gate 3 - docs-only: mirror paths-ignore (docs/**, **/*.md, CONTEXT.md,
            # .github/CI.md). Skip only when every changed file matches an ignored
            # path; when the base cannot be determined, run the checks (fail open).
            # PR pipelines carry the base SHA directly via the compile-time value
            # pipeline.event.github.pull_request.base.sha (docs: "The SHA of the base
            # branch of the pull request... Only populated for pull request events");
            # it interpolates to an empty string on push pipelines.
            $base = '<< pipeline.event.github.pull_request.base.sha >>'
            if ([string]::IsNullOrWhiteSpace($base) -and $isPr) {
              # PR association without a populated event value (e.g. api trigger):
              # resolve the base from the public GitHub pulls API.
              $prNumber = ''
              if ($prUrl -match '/pull/(\d+)') { $prNumber = $Matches[1] }
              try {
                if ([string]::IsNullOrWhiteSpace($prNumber)) { throw 'PR number not available from pipeline values.' }
                $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/pulls/$prNumber" -Headers @{ 'User-Agent' = 'codexbar-pr-check' }
                $baseSha = [string]$pr.base.sha
                if ([string]::IsNullOrWhiteSpace($baseSha)) { throw 'pulls API returned no base.sha.' }
                & git fetch origin $baseSha --depth=1
                if ($LASTEXITCODE -ne 0) { throw "git fetch base.sha exited with code $LASTEXITCODE" }
                $base = $baseSha
                Write-Host "Docs gate base resolved from GitHub pulls API: $baseSha"
              } catch {
                Write-Host "Docs gate base resolution failed ($($_.Exception.Message)): running full checks (fail open)."
                $base = ''
              }
            } elseif ([string]::IsNullOrWhiteSpace($base) -and $isMainPush) {
              & git rev-parse --verify --quiet 'HEAD^' *> $null
              if ($LASTEXITCODE -eq 0) { $base = 'HEAD^' } else { Write-Host 'No parent commit on main push: running full checks (fail open).' }
            }
            if ([string]::IsNullOrWhiteSpace($base)) { exit 0 }  # fail open: gate step ends, job continues
            $changed = & git diff --name-only "$base..$env:CIRCLE_SHA1"  # two-dot tree diff: base fetched at depth 1 may lack a merge base for three-dot
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'git diff against base failed: cannot evaluate docs-only gate; running full checks (fail open).'
              exit 0
            }
            $ignoredPattern = '^(docs/.*)|(.*\.md)$'
            $codeFiles = @($changed | Where-Object { $_ -and ($_ -notmatch $ignoredPattern) -and ($_ -ne 'CONTEXT.md') -and ($_ -ne '.github/CI.md') })
            if ($codeFiles.Count -eq 0) {
              Write-Host "All $($changed.Count) changed files match paths-ignore (docs/**, **/*.md, CONTEXT.md, .github/CI.md): hosted pr-check skips."
              & circleci-agent step halt
              if ($LASTEXITCODE -ne 0) { throw "circleci-agent step halt exited with code $LASTEXITCODE" }
              exit 0
            }
            Write-Host "$($codeFiles.Count) code file(s) changed: hosted pr-check passes docs gate."
      - restore_cache:
          name: Restore Cargo registry and git cache
          keys:
            - pr-check-cargo-{{ checksum "Cargo.lock" }}
            - pr-check-cargo-
      - restore_cache:
          name: Restore pnpm store cache
          keys:
            - pr-check-pnpm-{{ checksum "apps/desktop-tauri/pnpm-lock.yaml" }}
            - pr-check-pnpm-
      - run:
          name: Provision toolchain and run local-check ci slice
          shell: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          no_output_timeout: 60m
          command: |
            $ErrorActionPreference = 'Stop'
            # Rust stable with rustfmt, clippy, and the MSVC target.
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              Write-Host 'rustup is unavailable on the image; installing via rustup-init.exe (winget is not on the hosted image).'
              $rustupInit = Join-Path $env:TEMP 'rustup-init.exe'
              & curl.exe -sSfL -o $rustupInit https://win.rustup.rs/x86_64
              if ($LASTEXITCODE -ne 0) { throw "downloading rustup-init.exe exited with code $LASTEXITCODE" }
              & $rustupInit -y --default-toolchain none --profile minimal
              if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with code $LASTEXITCODE" }
              $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
              $env:Path = "$cargoBin;$env:Path"
            }
            & rustup toolchain install stable --profile default -c rustfmt,clippy -t x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install exited with code $LASTEXITCODE" }
            & rustup default stable
            if ($LASTEXITCODE -ne 0) { throw "rustup default exited with code $LASTEXITCODE" }
            Write-Host "[ok] rustup default stable (rustc $((& rustc --version)))"
            # Node exact major 24 (GH workflow baseline) with pnpm from the
            # packageManager pin.
            $env:Path = "C:\Program Files\nodejs;$env:Path"
            $requiredNodeMajor = 24
            $nodeFallbackVersion = '24.18.0'
            $nodeVersion = $null
            if (Get-Command node -ErrorAction SilentlyContinue) { $nodeVersion = (& node --version).Trim() }
            $nodeMajor = 0
            if ($nodeVersion -match '^v(\d+)\.') { $nodeMajor = [int]$Matches[1] }
            if ($nodeMajor -ne $requiredNodeMajor) {
              $found = if ($nodeVersion) { $nodeVersion } else { 'none' }
              Write-Host "Node $requiredNodeMajor.x is required (image has $found); installing Node $nodeFallbackVersion via official MSI (winget is not on the hosted image)."
              $nodeMsi = Join-Path $env:TEMP "node-v$nodeFallbackVersion-x64.msi"
              & curl.exe -sSfL -o $nodeMsi "https://nodejs.org/dist/v$nodeFallbackVersion/node-v$nodeFallbackVersion-x64.msi"
              if ($LASTEXITCODE -ne 0) { throw "downloading Node MSI exited with code $LASTEXITCODE" }
              $msiArgs = @('/i', $nodeMsi, '/qn', '/norestart')
              $proc = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
              if ($proc.ExitCode -ne 0) { throw "msiexec install exited with code $($proc.ExitCode)" }
              # The image's preinstalled Node (a different major) may sit
              # earlier on PATH; resolve node strictly from the MSI dir.
              $nodeExe = 'C:\Program Files\nodejs\node.exe'
              if (-not (Test-Path $nodeExe)) { throw 'node.exe is still unavailable after MSI provisioning.' }
              $nodeVersion = (& $nodeExe --version).Trim()
              $nodeMajor = [int]($nodeVersion -replace '^v(\d+)\..*$', '$1')
              if ($nodeMajor -ne $requiredNodeMajor) { throw "Node $nodeVersion is installed; required major $requiredNodeMajor." }
              $env:Path = "C:\Program Files\nodejs;$env:Path"
            }
            Write-Host "[ok] Node $nodeVersion"
            $pnpmShimDir = Join-Path $env:LOCALAPPDATA 'CodexBar\ci-toolchain\pnpm'
            New-Item -ItemType Directory -Force -Path $pnpmShimDir | Out-Null
            & corepack enable --install-directory $pnpmShimDir
            if ($LASTEXITCODE -ne 0) { throw "corepack enable exited with code $LASTEXITCODE" }
            # packageManager in apps/desktop-tauri/package.json is the source of
            # truth for the pnpm version (no hardcoded drift).
            $packageManager = [string]((Get-Content -Raw -LiteralPath 'apps/desktop-tauri/package.json' | ConvertFrom-Json).packageManager)
            if ($packageManager -notmatch '^pnpm@(.+)$') { throw "packageManager '$packageManager' does not match ^pnpm@<version>." }
            $expectedPnpm = $Matches[1]
            & corepack prepare $packageManager --activate
            if ($LASTEXITCODE -ne 0) { throw "corepack prepare $packageManager --activate exited with code $LASTEXITCODE" }
            $env:Path = "$pnpmShimDir;$env:Path"
            $pnpmVersion = (& pnpm --version).Trim()
            if ($pnpmVersion -ne $expectedPnpm) { throw "pnpm $pnpmVersion is active; expected exact $expectedPnpm (packageManager $packageManager)." }
            Write-Host "[ok] pnpm $pnpmVersion"
            # Delegate the check slice to the local-check script (fmt/clippy/test,
            # frontend install/test/build, interaction-guard tests) with the PATH
            # prefix set once.
            $env:Path = "$env:USERPROFILE\.cargo\bin;C:\Program Files\nodejs;$pnpmShimDir;$env:Path"
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path (Get-Location).Path 'scripts\local-check.ps1') -Slice ci
            if ($LASTEXITCODE -ne 0) { throw "local-check.ps1 -Slice ci failed with exit code $LASTEXITCODE" }
      - save_cache:
          name: Save Cargo registry and git cache
          key: pr-check-cargo-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - save_cache:
          name: Save pnpm store cache
          key: pr-check-pnpm-{{ checksum "apps/desktop-tauri/pnpm-lock.yaml" }}
          paths:
            - ~/AppData/Local/pnpm/store

workflows:
  release:
    jobs:
      - release-build:
          filters: &release-tag-filter
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - release-approval:
          type: approval
          requires:
            - release-build
          filters: *release-tag-filter
      - release-publish:
          context: gh-release-publisher
          requires:
            - release-approval
          filters: *release-tag-filter

  pr-check:
    jobs:
      - pr-check:
          filters:
            tags:
              ignore:
                - /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              only: /.*/
